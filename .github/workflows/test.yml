name: Godot checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.5.1
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
      - name: Import
        run: Godot_v4.5.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Simulation
        run: Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/simulation_test.gd
      - name: UI smoke test
        run: Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/ui_test.gd
      - name: Offline portraits and attribution
        run: Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/portrait_test.gd
      - name: World map and settings
        run: Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/graphics_test.gd
      - name: Worldwide country profiles and map labels
        run: Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/atlas_test.gd
      - name: Constitution and economic regression tests
        run: Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/update_test.gd
      - name: Two-process networking
        run: |
          for era in "" "--modern"; do
            Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/network_test.gd -- --server $era &
            server=$!
            sleep 1
            Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script res://tests/network_test.gd -- --client $era
            wait "$server"
          done
